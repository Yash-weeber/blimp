# YOLOv9 Configuration for Balloon Detection (1080x1920)

nc: 1  # Number of classes (just 'Balloon' as in your data.yaml)
depth_multiple: 1.0  # Model depth multiplier
width_multiple: 1.0  # Model width multiplier
img_size: [1080, 1920]  # Input image dimensions [height, width]

# Backbone layers
backbone:
  - [-1, 1, Focus, [64, 3]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C3, [128]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C3, [256]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 9, C3, [512]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C3, [1024]]  # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9

# Head layers
head:
  - [-1, 1, Conv, [512, 1, 1]]  # 10
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 11
  - [[-1, 6], 1, Concat, [1]]  # 12: concat with P4
  - [-1, 3, C3, [512, False]]  # 13

  - [-1, 1, Conv, [256, 1, 1]]  # 14
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 15
  - [[-1, 4], 1, Concat, [1]]  # 16: concat with P3
  - [-1, 3, C3, [256, False]]  # 17

  - [-1, 1, Conv, [256, 3, 2]]  # 18
  - [[-1, 14], 1, Concat, [1]]  # 19
  - [-1, 3, C3, [512, False]]  # 20

  - [-1, 1, Conv, [512, 3, 2]]  # 21
  - [[-1, 10], 1, Concat, [1]]  # 22
  - [-1, 3, C3, [1024, False]]  # 23

  - [[17, 20, 23], 1, Detect, [nc]]  # Detect(P3, P4, P5)
